<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Call — Step 1</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #272b35;
      --text: #e6e8ec;
      --muted: #9aa1ad;
      --accent: #4f8cff;
      --accent-press: #3a6fd6;
      --danger: #ff5d5d;
      --ok: #35c47a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .join {
      display: flex; gap: 8px; width: 100%; max-width: 420px; margin-bottom: 18px;
    }
    input {
      flex: 1; padding: 11px 13px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--panel); color: var(--text);
      font-size: 15px; outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      border: none; border-radius: 10px; padding: 11px 16px;
      font-size: 15px; font-weight: 600; cursor: pointer; color: #fff;
      background: var(--accent); transition: background .15s, opacity .15s;
    }
    button:hover { background: var(--accent-press); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.ghost { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
    button.danger { background: var(--danger); }
    .status {
      font-size: 13px; color: var(--muted); margin-bottom: 18px; min-height: 18px;
      text-align: center; max-width: 520px;
    }
    .videos {
      display: grid; gap: 14px; width: 100%; max-width: 920px;
      grid-template-columns: 1fr 1fr;
    }
    @media (max-width: 640px) { .videos { grid-template-columns: 1fr; } }
    .tile {
      position: relative; background: #000; border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3;
    }
    video { width: 100%; height: 100%; object-fit: cover; background: #000; }
    .label {
      position: absolute; left: 10px; bottom: 10px;
      background: rgba(0,0,0,.55); padding: 4px 9px; border-radius: 7px;
      font-size: 12px; letter-spacing: .02em;
    }
    .controls { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <h1>WebRTC Video Call</h1>
  <div class="sub">Step 1 · 1-to-1 · peer-to-peer</div>

  <div class="join">
    <input id="room" placeholder="Room name (e.g. test123)" value="test123" />
    <button id="joinBtn">Join</button>
  </div>

  <div class="status" id="status">Enter a room name and click Join. Open a second tab with the same room to connect.</div>

  <div class="videos">
    <div class="tile">
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="label">You</div>
    </div>
    <div class="tile">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="label">Remote</div>
    </div>
  </div>

  <div class="controls hidden" id="controls">
    <button class="ghost" id="micBtn">Mute mic</button>
    <button class="ghost" id="camBtn">Stop camera</button>
    <button class="danger" id="hangBtn">Hang up</button>
  </div>

  <script>
    const ICE_SERVERS = [
      // Public STUN only for now. TURN (for calls across firewalls/NAT) arrives in Step 2.
      { urls: 'stun:stun.l.google.com:19302' },
    ];

    const $ = (id) => document.getElementById(id);
    const roomInput = $('room');
    const joinBtn = $('joinBtn');
    const statusEl = $('status');
    const localVideo = $('localVideo');
    const remoteVideo = $('remoteVideo');
    const controls = $('controls');
    const micBtn = $('micBtn');
    const camBtn = $('camBtn');
    const hangBtn = $('hangBtn');

    let ws, pc, localStream;
    let isInitiator = false;
    let joined = false;
    let micOn = true, camOn = true;

    const setStatus = (t) => { statusEl.textContent = t; };
    const signalingUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;

    joinBtn.onclick = start;
    roomInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') start(); });

    async function start() {
      const room = (roomInput.value || '').trim() || 'default';
      joinBtn.disabled = true;
      roomInput.disabled = true;
      setStatus('Requesting camera and microphone…');

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      } catch (e) {
        setStatus('Could not access camera/mic: ' + e.message);
        joinBtn.disabled = false; roomInput.disabled = false;
        return;
      }

      localVideo.srcObject = localStream;
      controls.classList.remove('hidden');
      connect(room);
    }

    function connect(room) {
      ws = new WebSocket(signalingUrl);

      ws.onopen = () => {
        setStatus('Connected to signaling server. Joining room “' + room + '”…');
        ws.send(JSON.stringify({ type: 'join', room }));
      };

      ws.onmessage = async (ev) => {
        const msg = JSON.parse(ev.data);

        if (msg.type === 'room-full') {
          setStatus('That room already has 2 people (max in Step 1). Try another room name.');
          cleanup();
          return;
        }

        if (msg.type === 'joined') {
          joined = true;
          isInitiator = msg.initiator;
          createPeer();
          if (isInitiator) {
            setStatus('Someone is already here — calling them…');
            await makeOffer();
          } else {
            setStatus('Joined “' + room + '”. Waiting for someone to join and call…');
          }
          return;
        }

        if (msg.type === 'peer-joined') {
          setStatus('A peer joined. Establishing connection…');
          return;
        }

        if (msg.type === 'peer-left') {
          setStatus('The other person left the call.');
          remoteVideo.srcObject = null;
          return;
        }

        if (msg.type === 'signal') {
          await handleSignal(msg.data);
          return;
        }
      };

      ws.onclose = () => { if (!joined) setStatus('Signaling connection closed.'); };
      ws.onerror = () => setStatus('Signaling error — is the server running?');
    }

    function createPeer() {
      pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

      localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));

      pc.ontrack = (e) => { remoteVideo.srcObject = e.streams[0]; };

      pc.onicecandidate = (e) => {
        if (e.candidate) sendSignal({ candidate: e.candidate });
      };

      pc.onconnectionstatechange = () => {
        const s = pc.connectionState;
        if (s === 'connected') setStatus('In call ✓');
        else if (s === 'disconnected') setStatus('Peer disconnected — trying to recover…');
        else if (s === 'failed') setStatus('Connection failed. (Across networks you’ll need a TURN server — Step 2.)');
        else if (s === 'connecting') setStatus('Connecting…');
      };
    }

    async function makeOffer() {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      sendSignal({ sdp: pc.localDescription });
    }

    async function handleSignal(data) {
      if (data.sdp) {
        await pc.setRemoteDescription(data.sdp);
        if (data.sdp.type === 'offer') {
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          sendSignal({ sdp: pc.localDescription });
        }
      } else if (data.candidate) {
        try { await pc.addIceCandidate(data.candidate); }
        catch (err) { console.warn('addIceCandidate failed', err); }
      }
    }

    function sendSignal(data) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'signal', data }));
      }
    }

    // --- Controls ---
    micBtn.onclick = () => {
      micOn = !micOn;
      localStream.getAudioTracks().forEach((t) => (t.enabled = micOn));
      micBtn.textContent = micOn ? 'Mute mic' : 'Unmute mic';
    };
    camBtn.onclick = () => {
      camOn = !camOn;
      localStream.getVideoTracks().forEach((t) => (t.enabled = camOn));
      camBtn.textContent = camOn ? 'Stop camera' : 'Start camera';
    };
    hangBtn.onclick = cleanup;

    function cleanup() {
      if (pc) { pc.close(); pc = null; }
      if (ws) { ws.close(); ws = null; }
      if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
      localVideo.srcObject = null;
      remoteVideo.srcObject = null;
      controls.classList.add('hidden');
      joinBtn.disabled = false;
      roomInput.disabled = false;
      joined = false;
      setStatus('Call ended. Join again to reconnect.');
    }
  </script>
</body>
</html>
