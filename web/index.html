<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0b11" />
    <meta name="description" content="Huddle: upload your CV once, see your live ATS score, build a better CV with AI, apply in one click and talk to recruiters on in-browser video calls." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Huddle" />
    <link rel="preload" href="/fonts/texgyreadventor-bold.otf" as="font" type="font/otf" crossorigin />
    <script>
      // Set light/dark before the page paints (saved choice, else the device setting).
      try {
        var m = localStorage.getItem('huddle:mode');
        if (m !== 'light' && m !== 'dark') m = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = m;
      } catch (e) {}
    </script>
    <meta property="og:title" content="Huddle | Upload your CV once, get matched, talk face to face" />
    <meta property="og:description" content="AI CV builder, live ATS score, one-click apply, a permanent public CV link and video calls with recruiters." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Huddle | Upload your CV once, get matched, talk face to face</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
