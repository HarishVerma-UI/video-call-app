# coturn: relays call audio/video when two devices can't connect directly.
# The secret, realm and public IP are passed on the command line (docker-compose.yml).

listening-port=3478
tls-listening-port=5349
# Relay ports (open these UDP ports in the firewall: setup.sh does it).
min-port=49160
max-port=49250

# Short-lived credentials signed by the Huddle server (TURN REST API).
use-auth-secret
fingerprint

# Certificates copied from Caddy by turn-certs.sh (for turns: on 5349).
cert=/certs/turn.crt
pkey=/certs/turn.key
no-tlsv1
no-tlsv1_1

# Only relay to the public internet: never let TURN be used to reach the server's
# own private network or cloud metadata.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Limits so a single user can't use up the server.
user-quota=12
total-quota=1200
stale-nonce=600
no-cli
log-file=stdout
simple-log
